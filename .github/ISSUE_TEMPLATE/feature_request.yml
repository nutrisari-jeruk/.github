name: Feature Request
description: Suggest a feature or an improvement
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the **problem** first, then the solution.
        Do **not** paste passwords, tokens, or patient data.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or problem does this solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches considered, or why no change is needed. Optional.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Measurable, testable conditions.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      description: Reporter's suggestion only — decided at triage.
      options:
        - Low
        - Medium
        - High

  - type: input
    id: affected
    attributes:
      label: Affected app or service
      description: If known, e.g. simmas, helpdesk-it, satusehat. Optional.
