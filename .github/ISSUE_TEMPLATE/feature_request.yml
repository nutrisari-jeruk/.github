name: Feature Request
description: Usulkan fitur atau peningkatan
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Jelaskan **masalahnya** dulu, baru solusinya.
        **Jangan** tempel password, token, atau data pasien.

  - type: textarea
    id: masalah
    attributes:
      label: Masalah
      description: Kebutuhan/masalah user apa yang diselesaikan? Siapa yang terdampak?
    validations:
      required: true

  - type: textarea
    id: solusi
    attributes:
      label: Usulan solusi
    validations:
      required: true

  - type: textarea
    id: alternatif
    attributes:
      label: Alternatif yang dipertimbangkan
      description: Solusi lain yang dipertimbangkan, atau alasan tidak perlu. Opsional.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Kondisi terukur dan bisa diuji.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: dropdown
    id: prioritas
    attributes:
      label: Prioritas yang diusulkan
      description: Saran pelapor saja — diputuskan saat triage.
      options:
        - Rendah
        - Sedang
        - Tinggi

  - type: input
    id: affected
    attributes:
      label: Aplikasi atau layanan terdampak
      description: Jika tahu, mis. simmas, helpdesk-it, satusehat. Opsional.
