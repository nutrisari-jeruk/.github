name: Feature Request
description: Suggest a new feature or an improvement to an existing one
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the solution you propose.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should be built or changed?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we verify this is done? Example - "Validation rejects empty name input".
    validations:
      required: true

  - type: input
    id: affected
    attributes:
      label: Affected app or service
      description: If known, e.g. simmas, helpdesk-it, satusehat. Optional.
