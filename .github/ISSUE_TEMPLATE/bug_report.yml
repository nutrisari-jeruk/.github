name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For a **live production** problem, use the **Production Incident** template instead.
        File even if incomplete — update via comments.
        Do **not** paste passwords, tokens, or patient data.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What is broken? 1-2 sentences.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error message, logs, or a screenshot. Redact tokens & personal data.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/OS/app version; commit or host if known.
      placeholder: "Chrome 130 / Windows 11 / commit abc123"
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Always
        - Sometimes
        - Once
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Workaround, when it started, etc. Optional.
