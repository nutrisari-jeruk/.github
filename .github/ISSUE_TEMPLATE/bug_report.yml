name: Bug Report
description: Laporkan bug atau perilaku tidak sesuai
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Untuk masalah **production** yang sedang berjalan, gunakan template **Production Incident**.
        File dulu walau belum lengkap — perbarui lewat komentar.
        **Jangan** tempel password, token, atau data pasien.

  - type: textarea
    id: deskripsi
    attributes:
      label: Deskripsi
      description: Apa yang salah? 1-2 kalimat.
    validations:
      required: true

  - type: textarea
    id: reproduksi
    attributes:
      label: Langkah reproduksi
      placeholder: |
        1. Buka ...
        2. Klik ...
        3. Lihat ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Perilaku yang diharapkan
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Perilaku aktual
      description: Sertakan error message, log, atau screenshot. Sensor token & data pribadi.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/OS/versi aplikasi; commit atau host jika tahu.
      placeholder: "Chrome 130 / Windows 11 / commit abc123"
    validations:
      required: true

  - type: dropdown
    id: frekuensi
    attributes:
      label: Frekuensi
      options:
        - Selalu
        - Kadang-kadang
        - Sekali saja
    validations:
      required: true

  - type: textarea
    id: konteks
    attributes:
      label: Konteks tambahan
      description: Workaround, kapan mulai terjadi, dll. Opsional.
